# Example host Nginx site when using Let's Encrypt on the EC2 box.
# App Compose stack stays on 127.0.0.1:8080; this terminates TLS on 443.
#
# certbot certonly --nginx -d quotes.example.com
# then enable this site and reload nginx.

server {
    listen 80;
    server_name quotes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quotes.example.com;

    ssl_certificate     /etc/letsencrypt/live/quotes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotes.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
